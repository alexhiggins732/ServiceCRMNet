version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crm-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong@Passw0rd!}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD:-YourStrong@Passw0rd!}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Crm.Api/Dockerfile
    container_name: crm-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DB_CONNECTION_STRING=Server=sqlserver,1433;Database=CrmDb;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd!};TrustServerCertificate=True;
    ports:
      - "5000:8080"
      - "5001:8081"

  web:
    build:
      context: .
      dockerfile: src/Crm.Web/Dockerfile
    container_name: crm-web
    depends_on:
      - api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - API_URL=http://api:8080
    ports:
      - "5002:8080"
      - "5003:8081"

volumes:
  sqlserver-data:

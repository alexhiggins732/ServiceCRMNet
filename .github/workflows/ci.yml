name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Format Check
      run: dotnet format src/Crm.sln --verify-no-changes

    - name: Restore dependencies
      run: dotnet restore src/Crm.sln

    - name: Build
      run: dotnet build src/Crm.sln --no-restore

    - name: Test
      run: dotnet test src/Crm.sln --no-build --verbosity normal
